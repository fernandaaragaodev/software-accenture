spring.application.name=officehub-api
server.port=8080

spring.datasource.url=jdbc:h2:mem:officehub;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Mínimo 32 caracteres (256 bits) para HS256
officehub.jwt.secret=${OFFICEHUB_JWT_SECRET:segredosegredosegredosegredosegredo123456789012345678}
