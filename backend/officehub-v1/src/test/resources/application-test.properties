spring.datasource.url=jdbc:h2:mem:officehub_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.security.jwt.secret=OfficeHub-Test-JWT-Secret-Key-Minimo-32-Chars
app.security.jwt.expiration-minutes=60
app.security.refresh-token.expiration-days=7
app.security.rate-limit.login-per-minute=1000

ia.motor=ESPACIAL
ia.openrouter.api-key=
